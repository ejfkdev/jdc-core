[package]
name = "jdc-core"
version = "0.1.10"
edition = "2021"
description = "Machine-neutral decompiler core: IR, CFG structuring, statement conversion, Java emission. Front-end agnostic (JVM class files, DEX, ...)."
license = "MIT"
repository = "https://github.com/ejfkdev/jdc-core"
keywords = ["decompiler", "reverse-engineering", "cfg", "java"]
categories = ["development-tools::debugging"]

[dependencies]
bitflags = "2"
serde = { version = "1", features = ["derive"], optional = true }

[features]
visit-stats = []
default = []
# Serialize the shared type model (`types::*`): a front-end that offers a JSON
# dump of its parse turns this on and forwards it from its own feature.
serde = ["dep:serde", "bitflags/serde"]

[profile.release]
debug = true
